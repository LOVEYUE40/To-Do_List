name: CI

# 每次推分支 / 开 PR 都跑一遍静态检查与单元测试。
# 标签推送交给 release.yml，避免同一份代码被检查两次。
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

# 同一分支连续推送时取消上一次未完成的运行，省 runner 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仓库内 .npmrc 指向国内镜像，境外 Runner 访问不稳定，
      # 这里用命令行参数覆盖为官方源（CLI 优先级高于 .npmrc）。
      # ELECTRON_MIRROR 只影响 electron 的 postinstall 下载，缺了也不影响
      # 下面的 typecheck / lint / test（这三步都不需要 Electron 二进制）。
      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci --registry https://registry.npmjs.org/

      # 拆成了 node / web 两套 tsconfig，渲染层不再能悄悄用上 Node 全局变量
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
