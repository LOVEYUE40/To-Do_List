name: Release

# 推送 v* 标签即自动构建并发布，产物附带 latest.yml 供客户端自动更新使用
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仓库内 .npmrc 指向国内镜像，境外 Runner 访问不稳定，
      # 这里用命令行参数覆盖为官方源（CLI 优先级高于 .npmrc）
      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org/

      # npm 11 会拦截 postinstall 脚本，兜底确保 Electron 二进制就位
      - name: Ensure Electron binary
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            node node_modules/electron/install.js
          }

      - name: Type check
        run: npm run typecheck

      # 注意：这里不要设 ELECTRON_MIRROR——electron-builder 的下载器拼 GitHub
      # release URL 时不补 v 前缀（31.7.7 vs v31.7.7），会 404；
      # 不设置时它默认走官方地址且路径正确。
      # 只构建产物，不用 electron-builder 内置 publish（实测会在
      # “creating GitHub release”后静默退出），上传交给下一步
      - name: Build installer
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run package -- --publish never

      # 显式创建 Release 并上传安装包 / blockmap / latest.yml，
      # 任何失败都会明确报错，供 electron-updater 使用；
      # 更新说明维护在 .github/release-notes.md，随仓库迭代同步修改
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

